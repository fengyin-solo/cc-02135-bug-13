<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件下载 - CloudVault 分享</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☁️</text></svg>">
</head>
<body>
    <div class="container">
        <h1>文件分享</h1>
        <p class="subtitle">您的好友分享了一个文件给您</p>

        <div class="file-list-section" id="shareContainer">
            <div class="loading-state" id="loadingState">
                <div class="spinner" style="margin: 40px auto;"></div>
                <p id="loadingText">正在加载分享信息...</p>
            </div>

            <div class="error-state" id="errorState" style="display: none; text-align: center; padding: 40px 20px;">
                <div style="font-size: 64px; margin-bottom: 16px;">⚠️</div>
                <h2 id="errorTitle" style="text-transform: none; letter-spacing: normal; font-size: 1.25rem; margin-bottom: 8px;">链接无效</h2>
                <p id="errorMessage" style="color: var(--text-secondary); margin-bottom: 24px;">该分享链接不存在或已失效</p>
                <a href="index.html" class="btn-primary" style="text-decoration: none; display: inline-block; padding: 12px 32px;">返回首页</a>
            </div>

            <div class="share-content" id="shareContent" style="display: none;">
                <div class="file-info-large" style="text-align: center; margin-bottom: 32px;">
                    <div class="file-icon-large" id="fileIcon" style="width: 80px; height: 80px; margin: 0 auto 20px; background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(139, 92, 246, 0.2)); border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem;">📁</div>
                    <h2 id="fileName" style="text-transform: none; letter-spacing: normal; font-size: 1.25rem; margin-bottom: 8px;"></h2>
                    <p id="fileSize" style="color: var(--text-secondary); font-size: 0.9375rem;"></p>
                </div>

                <div class="share-meta" style="background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 32px;">
                    <div style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border);">
                        <span style="color: var(--text-secondary); font-size: 0.875rem;">分享者</span>
                        <span id="sharedBy" style="font-weight: 500;"></span>
                    </div>
                    <div style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border);">
                        <span style="color: var(--text-secondary); font-size: 0.875rem;">有效期至</span>
                        <span id="expireTime" style="font-weight: 500;"></span>
                    </div>
                    <div style="display: flex; justify-content: space-between; padding: 12px 0;">
                        <span style="color: var(--text-secondary); font-size: 0.875rem;">下载次数</span>
                        <span id="downloadCount" style="font-weight: 500;"></span>
                    </div>
                </div>

                <button class="upload-btn" id="downloadBtn" onclick="downloadFile()" style="width: 100%; justify-content: center; margin: 0;">
                    <span style="font-size: 1.125rem;">⬇️ 下载文件</span>
                </button>

                <p style="text-align: center; color: var(--text-secondary); font-size: 0.8125rem; margin-top: 20px;">
                    请在有效期内下载，过期后链接将失效
                </p>
            </div>
        </div>
    </div>

    <!-- 加载动画遮罩 -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loader">
            <div class="spinner"></div>
            <p id="loadingOverlayText">下载中...</p>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        const API_BASE = CONFIG.API_BASE;
        let currentShareId = null;
        let shareInfo = null;
        let isDownloading = false;
        let loadRequestSeq = 0;

        // 显示加载动画
        function showLoading(text = '加载中...') {
            document.getElementById('loadingOverlayText').textContent = text;
            document.getElementById('loadingOverlay').classList.add('active');
        }

        // 隐藏加载动画
        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('active');
        }

        // HTML转义防止XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 获取文件图标
        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            const icons = {
                pdf: '📄', doc: '📝', docx: '📝', txt: '📃',
                jpg: '🖼️', jpeg: '🖼️', png: '🖼️', gif: '🖼️',
                mp3: '🎵', wav: '🎵', mp4: '🎬', avi: '🎬',
                zip: '📦', rar: '📦', '7z': '📦',
                js: '💻', py: '🐍', html: '🌐', css: '🎨'
            };
            return icons[ext] || '📁';
        }

        // 格式化文件大小
        function formatSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // 格式化时间戳
        function formatTimestamp(timestamp) {
            if (!timestamp) return '永久有效';
            const date = new Date(timestamp * 1000);
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // 下载次数展示：以后端返回为准，前端不自行换算
        function formatDownloadCount(info) {
            if (info.max_downloads == null) {
                return `${info.download_count} 次（无限制）`;
            }
            return `${info.download_count} / ${info.max_downloads} 次`;
        }

        // 失效原因映射为页面标题
        function getErrorTitle(reason) {
            if (reason && reason.includes('过期')) return '链接已过期';
            if (reason && reason.includes('用完')) return '下载次数已用完';
            return '链接已失效';
        }

        // 获取分享链接信息（公开页与创建者列表看到的状态由同一后端接口逻辑保证一致）
        async function loadShareInfo() {
            currentShareId = window.location.hash.substring(1);

            if (!currentShareId) {
                showError('无效链接', '请检查您的分享链接是否完整');
                return;
            }

            // 序号守卫：快速刷新（如下载成功后刷新 + 手动刷新）时只渲染最新一次结果，
            // 避免旧响应覆盖新状态造成“次数重复显示/状态回退”
            const requestSeq = ++loadRequestSeq;

            try {
                const response = await fetch(`${API_BASE}/share/${currentShareId}`, {
                    cache: 'no-store'
                });
                const info = await response.json();

                if (requestSeq !== loadRequestSeq) return;

                if (!response.ok) {
                    showError('链接不存在', (info && info.error) || '该分享链接不存在');
                    return;
                }

                shareInfo = info;

                if (!info.is_valid) {
                    // 已失效（过期/次数用完）：立即展示失效页，任何刷新都不会恢复可下载状态
                    showError(
                        getErrorTitle(info.error_msg),
                        info.error_msg || '该分享链接已过期或下载次数已用完'
                    );
                    setDownloadButtonEnabled(false);
                    return;
                }

                showShareContent(info);
            } catch (error) {
                if (requestSeq === loadRequestSeq) {
                    showError('加载失败', `无法加载分享信息: ${error.message}`);
                }
            }
        }

        // 显示错误状态
        function showError(title, message) {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('shareContent').style.display = 'none';
            document.getElementById('errorState').style.display = 'block';
            document.getElementById('errorTitle').textContent = title;
            document.getElementById('errorMessage').textContent = message;
        }

        // 显示分享内容
        function showShareContent(info) {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('errorState').style.display = 'none';
            document.getElementById('shareContent').style.display = 'block';

            document.getElementById('fileIcon').textContent = getFileIcon(info.filename);
            document.getElementById('fileName').textContent = escapeHtml(info.filename);
            document.getElementById('fileSize').textContent = formatSize(info.filesize);
            document.getElementById('sharedBy').textContent = escapeHtml(info.created_by);
            document.getElementById('expireTime').textContent = formatTimestamp(info.expires_at);
            document.getElementById('downloadCount').textContent = formatDownloadCount(info);
            setDownloadButtonEnabled(true);
        }

        function setDownloadButtonEnabled(enabled) {
            const btn = document.getElementById('downloadBtn');
            btn.disabled = !enabled;
            btn.style.opacity = enabled ? '1' : '0.5';
            btn.style.cursor = enabled ? 'pointer' : 'not-allowed';
        }

        // 下载文件
        async function downloadFile() {
            if (!currentShareId || isDownloading) return;

            // 以本地最新状态再确认一次，剩 0 次/已过期直接拦截，不发取件请求
            if (shareInfo && !shareInfo.is_valid) {
                showError(
                    getErrorTitle(shareInfo.error_msg),
                    shareInfo.error_msg || '该分享链接已失效'
                );
                return;
            }

            isDownloading = true;
            setDownloadButtonEnabled(false);
            showLoading('准备下载...');

            try {
                const response = await fetch(`${API_BASE}/share/${currentShareId}/download`, {
                    cache: 'no-store'
                });

                if (!response.ok) {
                    let message = '未知错误';
                    try {
                        const result = await response.json();
                        message = result.error || message;
                    } catch (e) { /* 忽略非 JSON 错误体 */ }
                    hideLoading();
                    alert(`下载失败: ${message}`);

                    // 立即以后端最新状态重新渲染（过期或次数用完会直接切到失效页）
                    await loadShareInfo();
                    return;
                }

                const blob = await response.blob();
                const contentDisposition = response.headers.get('Content-Disposition');
                let filename = shareInfo ? shareInfo.filename : 'download';

                if (contentDisposition) {
                    const match = contentDisposition.match(/filename\*?=(?:UTF-8'')?["']?([^"';\n]+)/i);
                    if (match) filename = decodeURIComponent(match[1]);
                }

                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                a.remove();

                hideLoading();

                // 刷新为后端最新计数；若这是最后一次，页面会立即变为失效态
                await loadShareInfo();
            } catch (error) {
                hideLoading();
                alert(`下载失败: ${error.message}`);
                setDownloadButtonEnabled(shareInfo ? shareInfo.is_valid : true);
            } finally {
                isDownloading = false;
            }
        }

        // 页面加载时获取分享信息
        document.addEventListener('DOMContentLoaded', loadShareInfo);
    </script>
</body>
</html>
